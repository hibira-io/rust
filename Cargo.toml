[package]
name = "hibira"
version = "0.1.0"
edition = "2021"
description = "Hibira server SDK: Pusher-protocol realtime (trigger, channel auth, webhooks), waiting rooms with Axum and Actix middleware, Chat API, Approvals and Live Chat verified visitors"
license = "MIT"
repository = "https://github.com/hibira-io/rust"
homepage = "https://hibira.io"
documentation = "https://docs.rs/hibira"
readme = "README.md"
keywords = ["hibira", "pusher", "websocket", "realtime", "waiting-room"]
categories = ["web-programming", "api-bindings", "web-programming::websocket"]
exclude = [".github"]

[features]
default = ["client"]
## The HTTP client: trigger events, Chat API, Approvals.
client = ["dep:reqwest"]
## Waiting room middleware for Axum.
axum = ["dep:axum"]
## Waiting room middleware for Actix Web.
actix = ["dep:actix-web"]

[dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
url = "2"
http = "1"
cookie = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
axum = { version = "0.8", default-features = false, optional = true }
actix-web = { version = "4.9", default-features = false, features = ["cookies"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
actix-web = { version = "4.9", default-features = false, features = ["macros", "cookies"] }
actix-rt = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
